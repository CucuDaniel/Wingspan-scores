<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wingspan Score Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Crimson+Pro:wght@300;400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

    <style>
            /* =====================================================
           ROOT VARIABLES
        ===================================================== */
            :root {
                --parchment: #fdf6e3;
                --parchment-dk: #e4d0a0;
                --ink: #2c1a0e;
                --ink-light: #5a3e28;
                --rust: #b5451b;
                --rust-light: #d9603a;
                --gold: #c9993a;
                --gold-light: #e8c060;
                --base-bg: #d0ece9;
                --base-text: #1b5e20;
                --europe-bg: #1a237e;
                --europe-text: #ffffff;
                --oceania-bg: #ffab91;
                --oceania-text: #4e1700;
                --americas-bg: #2e7d32;
                --americas-text: #ffffff;
                --radius: 10px;
                --radius-sm: 6px;
            }

            /* =====================================================
           RESET
        ===================================================== */
            *, *::before, *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            /* =====================================================
           BASE
        ===================================================== */
            body {
                font-family: 'Crimson Pro', Georgia, serif;
                font-size: 16px;
                background-color: var(--parchment);
                color: var(--ink);
                min-height: 100vh;
            }

            /* =====================================================
           HEADER
        ===================================================== */
            header {
                background: var(--ink);
                border-bottom: 3px solid var(--gold);
                position: sticky;
                top: 0;
                z-index: 100;
            }

            .header-inner {
                max-width: 1200px;
                margin: 0 auto;
                padding: 14px 24px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 16px;
            }

            .logo-group {
                display: flex;
                align-items: center;
                gap: 12px;
            }

            .feather {
                font-size: 2rem;
                display: inline-block;
                animation: sway 4s ease-in-out infinite;
            }

            @keyframes sway {
                0%, 100% {
                    transform: rotate(-6deg);
                }

                50% {
                    transform: rotate(6deg);
                }
            }

            .logo-text h1 {
                font-family: 'Playfair Display', serif;
                font-size: 1.75rem;
                font-weight: 700;
                color: var(--gold-light);
                line-height: 1;
            }

            .logo-text p {
                font-size: 0.72rem;
                color: rgba(253,246,227,0.5);
                letter-spacing: 0.12em;
                text-transform: uppercase;
                margin-top: 3px;
            }

            /* =====================================================
           BUTTONS
        ===================================================== */
            .btn {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                padding: 10px 20px;
                border: none;
                border-radius: var(--radius-sm);
                font-family: 'Crimson Pro', serif;
                font-size: 1rem;
                font-weight: 600;
                cursor: pointer;
                transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
                white-space: nowrap;
            }

                .btn:active {
                    transform: translateY(1px);
                }

                .btn:disabled {
                    opacity: 0.6;
                    cursor: not-allowed;
                    transform: none !important;
                }

            .btn-rust {
                background: var(--rust);
                color: #fff;
            }

                .btn-rust:hover {
                    background: var(--rust-light);
                    transform: translateY(-1px);
                    box-shadow: 0 4px 12px rgba(181,69,27,0.35);
                }

            .btn-ghost {
                background: transparent;
                color: var(--ink-light);
                border: 1.5px solid var(--parchment-dk);
            }

                .btn-ghost:hover {
                    border-color: var(--ink);
                    color: var(--ink);
                }

            .btn-icon {
                background: transparent;
                border: none;
                cursor: pointer;
                padding: 5px 8px;
                border-radius: 4px;
                font-size: 1rem;
                line-height: 1;
                color: inherit;
                opacity: 0.65;
                transition: opacity 0.15s, background 0.15s;
            }

                .btn-icon:hover {
                    opacity: 1;
                    background: rgba(0,0,0,0.1);
                }

            /* =====================================================
           MAIN LAYOUT
        ===================================================== */
            main {
                max-width: 1200px;
                margin: 0 auto;
                padding: 24px 24px 60px;
            }

            /* =====================================================
           CONTROLS BAR
        ===================================================== */
            .controls-bar {
                display: flex;
                align-items: center;
                flex-wrap: wrap;
                gap: 10px;
                padding: 14px 16px;
                margin-bottom: 18px;
                background: rgba(255,255,255,0.65);
                border: 1px solid var(--parchment-dk);
                border-radius: var(--radius);
            }

            .sort-label {
                font-family: 'Space Mono', monospace;
                font-size: 0.68rem;
                text-transform: uppercase;
                letter-spacing: 0.1em;
                color: var(--ink-light);
                white-space: nowrap;
            }

            .chips {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
            }

            .chip {
                padding: 4px 14px;
                border: 1.5px solid var(--parchment-dk);
                border-radius: 20px;
                background: transparent;
                font-family: 'Crimson Pro', serif;
                font-size: 0.9rem;
                color: var(--ink-light);
                cursor: pointer;
                transition: all 0.15s;
            }

                .chip:hover {
                    border-color: var(--rust);
                    color: var(--rust);
                }

                .chip.active {
                    background: var(--rust);
                    border-color: var(--rust);
                    color: #fff;
                }

            .filter-select {
                padding: 5px 10px;
                border: 1.5px solid var(--parchment-dk);
                border-radius: var(--radius-sm);
                background: rgba(255,255,255,0.8);
                font-family: 'Crimson Pro', serif;
                font-size: 0.95rem;
                color: var(--ink);
                cursor: pointer;
            }

            /* =====================================================
           GAMES CONTAINER
        ===================================================== */
        .games-wrap {
            background: transparent; /* was solid box */
            border: none;
            border-radius: 0;
            overflow: visible;
            padding: 4px 0;
        }
            /* loading / empty */
        .state-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 64px 24px;
            color: var(--ink-light);
            font-size: 1.05rem;
        }

                .state-box .icon {
                    font-size: 2.8rem;
                }

            .spinner {
                width: 36px;
                height: 36px;
                border: 3px solid var(--parchment-dk);
                border-top-color: var(--rust);
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            .hidden {
                display: none !important;
            }

            /* =====================================================
           GAME GROUP (grouped / date view)
        ===================================================== */
        .game-group {
            margin: 10px 8px 14px; /* separation between games */
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.06);
            background: rgba(255,255,255,0.75); /* soft neutral base */
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
        }

            /* no more connecting bottom border */
            .game-group:last-child {
                margin-bottom: 18px;
            }

        .group-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 16px;
            cursor: pointer;
            user-select: none;
        }

        /* keep meta/actions as they are */
        .group-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
            .game-date {
                font-family: 'Space Mono', monospace;
                font-size: 0.74rem;
                opacity: 0.8;
            }
        
            .exp-badge {
            font-size: 0.68rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            background: rgba(255,255,255,0.45);
            border: 1px solid rgba(255,255,255,0.7);
        }

            .winner-tag {
                font-size: 0.85rem;
            }

            .group-actions {
                display: flex;
                gap: 4px;
                flex-shrink: 0;
            }

            /* expansion colour themes (could be background: rgba(46, 125, 50, 0.12); */
        .game-group.exp-base {
            background: #DFF2FB;
            color: var(--ink);
        }

        .game-group.exp-europe {
            background: #D5DAFC;
            color: var(--ink);
        }

        .game-group.exp-oceania {
            background: #F8DBEB;
            color: var(--ink);
        }

        .game-group.exp-americas {
            background: #CEF5DA;
            color: var(--ink);
        }





            /* =====================================================
           SCORES TABLE
        ===================================================== */
            .scores-table {
                width: 100%;
                border-collapse: collapse;
                font-size: 0.92rem;
            }

                .scores-table thead tr {
                    background: rgba(0,0,0,0.055);
                    border-bottom: 1px solid rgba(0,0,0,0.09);
                }

                .scores-table th {
                    font-family: 'Space Mono', monospace;
                    font-size: 0.62rem;
                    text-transform: uppercase;
                    letter-spacing: 0.07em;
                    padding: 6px 14px;
                    text-align: right;
                    font-weight: 400;
                }

                    .scores-table th:first-child {
                        text-align: left;
                    }

                .scores-table td {
                    padding: 8px 14px;
                    text-align: right;
                    border-bottom: 1px solid rgba(0,0,0,0.05);
                }

                    .scores-table td:first-child {
                        text-align: left;
                        background: rgba(0,0,0,0.055);
                    }

                .scores-table tbody tr:last-child td {
                    border-bottom: none;
                }

                .scores-table tbody tr:hover td {
                    background: rgba(0,0,0,0.03);
                }

            .winner-row td {
                font-weight: 700;
            }

                .winner-row td:first-child::before {
                    content: '🏆 ';
                }

        .player-link {
            cursor: pointer;
            color: var(--ink);
            text-decoration: underline;
            text-decoration-style: dotted;
            text-underline-offset: 3px;
            font-weight: 700;
            transition: opacity 0.15s;
        }

                .player-link:hover {
                    opacity: 0.6;
                }

            .score-cell {
                font-family: 'Space Mono', monospace;
                font-size: 0.82rem;
                cursor: pointer;
                padding: 2px 5px;
                border-radius: 3px;
                transition: background 0.12s;
                display: inline-block;
            }

                .score-cell:hover {
                    background: rgba(0,0,0,0.1);
                }

            .total-cell {
                font-family: 'Space Mono', monospace;
                font-weight: 700;
            }

            /* =====================================================
           SORTED FLAT VIEW
        ===================================================== */
        .sorted-row {
            display: grid;
            grid-template-columns: 2fr 120px 1fr;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            margin-bottom: 8px;
            border: 1px solid rgba(0,0,0,0.05);
            border-radius: 12px;
            cursor: pointer;
            transition: filter 0.15s;
        }

            .sorted-row.exp-base {
                background: #DFF2FB;
            }

            .sorted-row.exp-europe {
                background: #D5DAFC;
            }

            .sorted-row.exp-oceania {
                background: #F8DBEB;
            }

            .sorted-row.exp-americas {
                background: #CEF5DA;
            }
            .sorted-row:last-child {
                border-bottom: 1px solid rgba(0,0,0,0.05);
            }

                .sorted-row:hover {
                    filter: brightness(0.96);
                }

            .sorted-player {
                font-weight: 600;
                font-size: 1rem;
            }

            .sorted-sub {
                font-size: 0.8rem;
                opacity: 0.7;
                margin-top: 2px;
            }

            .sorted-score {
                font-family: 'Space Mono', monospace;
                font-size: 1.25rem;
                font-weight: 700;
                color: var(--rust);
            }

            .sorted-score-label {
                font-size: 0.72rem;
                opacity: 0.7;
                margin-top: 1px;
            }

            .sorted-total {
                font-size: 0.88rem;
                opacity: 0.75;
                text-align: right;
            }

            /* =====================================================
           OVERLAYS
        ===================================================== */
            .overlay {
                position: fixed;
                inset: 0;
                background: rgba(44,26,14,0.5);
                z-index: 200;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 16px;
                animation: fadein 0.2s ease;
            }

            @keyframes fadein {
                from {
                    opacity: 0;
                }

                to {
                    opacity: 1;
                }
            }

            .modal {
                background: var(--parchment);
                border: 2px solid var(--gold);
                border-radius: var(--radius);
                box-shadow: 0 10px 50px rgba(44,26,14,0.25);
                position: relative;
                width: 100%;
                max-height: 92vh;
                overflow-y: auto;
                animation: slideup 0.22s ease;
            }

            @keyframes slideup {
                from {
                    transform: translateY(16px);
                    opacity: 0;
                }

                to {
                    transform: translateY(0);
                    opacity: 1;
                }
            }

            .modal-wizard {
                max-width: 520px;
            }

            .modal-detail {
                max-width: 700px;
            }

            .modal-profile {
                max-width: 720px;
            }

            .modal-close-btn {
                position: absolute;
                top: 12px;
                right: 14px;
                background: transparent;
                border: none;
                font-size: 1rem;
                cursor: pointer;
                color: var(--ink-light);
                width: 28px;
                height: 28px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: background 0.15s;
                z-index: 2;
            }

                .modal-close-btn:hover {
                    background: rgba(44,26,14,0.1);
                }

            /* =====================================================
           WIZARD
        ===================================================== */
            .wizard-head {
                padding: 22px 24px 14px;
                border-bottom: 1px solid var(--parchment-dk);
            }

                .wizard-head h2 {
                    font-family: 'Playfair Display', serif;
                    font-size: 1.4rem;
                }

            .step-dots {
                display: flex;
                gap: 6px;
                margin-top: 12px;
            }

            .step-dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: var(--parchment-dk);
                transition: background 0.2s, transform 0.2s;
            }

                .step-dot.active {
                    background: var(--rust);
                    transform: scale(1.35);
                }

                .step-dot.done {
                    background: var(--gold);
                }

            .wizard-body {
                padding: 22px 24px;
                min-height: 220px;
            }

            .wizard-foot {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 14px 24px;
                border-top: 1px solid var(--parchment-dk);
            }

            /* =====================================================
           FORM ELEMENTS
        ===================================================== */
            .field {
                margin-bottom: 18px;
            }

                .field label {
                    display: block;
                    font-family: 'Space Mono', monospace;
                    font-size: 0.68rem;
                    text-transform: uppercase;
                    letter-spacing: 0.1em;
                    color: var(--ink-light);
                    margin-bottom: 7px;
                }

                .field input[type="text"],
                .field input[type="date"] {
                    width: 100%;
                    padding: 9px 12px;
                    border: 1.5px solid var(--parchment-dk);
                    border-radius: var(--radius-sm);
                    background: rgba(255,255,255,0.8);
                    font-family: 'Crimson Pro', serif;
                    font-size: 1rem;
                    color: var(--ink);
                    transition: border-color 0.18s, box-shadow 0.18s;
                }

                .field input:focus {
                    outline: none;
                    border-color: var(--rust);
                    box-shadow: 0 0 0 3px rgba(181,69,27,0.13);
                }

            .player-chips-wrap {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
            }

            .pchip {
                padding: 6px 16px;
                border: 2px solid var(--parchment-dk);
                border-radius: 20px;
                background: transparent;
                font-family: 'Crimson Pro', serif;
                font-size: 0.95rem;
                color: var(--ink);
                cursor: pointer;
                transition: all 0.15s;
            }

                .pchip.on {
                    background: var(--rust);
                    border-color: var(--rust);
                    color: #fff;
                }

                .pchip:hover:not(.on) {
                    border-color: var(--rust);
                    color: var(--rust);
                }

            .add-player-row {
                display: flex;
                gap: 8px;
                margin-top: 10px;
            }

                .add-player-row input {
                    flex: 1;
                    padding: 8px 12px;
                    border: 1.5px solid var(--parchment-dk);
                    border-radius: var(--radius-sm);
                    background: rgba(255,255,255,0.8);
                    font-family: 'Crimson Pro', serif;
                    font-size: 0.95rem;
                    color: var(--ink);
                }

                    .add-player-row input:focus {
                        outline: none;
                        border-color: var(--rust);
                        box-shadow: 0 0 0 3px rgba(181,69,27,0.13);
                    }

            .exp-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .exp-card {
                padding: 12px;
                border: 2px solid var(--parchment-dk);
                border-radius: var(--radius-sm);
                cursor: pointer;
                text-align: center;
                font-family: 'Crimson Pro', serif;
                font-size: 0.95rem;
                font-weight: 600;
                transition: all 0.15s;
            }

                .exp-card.exp-base {
                    background: #DFF2FB;
                    color: var(--ink);
                }

                .exp-card.exp-europe {
                    background: #D5DAFC;
                    color: var(--ink);
                }

                .exp-card.exp-oceania {
                    background: #F8DBEB;
                    color: var(--ink);
                }

                .exp-card.exp-americas {
                    background: #CEF5DA;
                    color: var(--ink);
                }

                .exp-card.on {
                    border-color: var(--rust);
                    box-shadow: 0 0 0 3px rgba(181,69,27,0.2);
                    transform: translateY(-1px);
                }

            /* score input rows in wizard */
            .score-rows {
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            .score-row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
            }

                .score-row label {
                    font-family: 'Crimson Pro', serif;
                    font-size: 1rem;
                    font-weight: 600;
                    flex: 1;
                }

                .score-row input[type="number"] {
                    width: 90px;
                    flex-shrink: 0;
                    padding: 8px 10px;
                    border: 1.5px solid var(--parchment-dk);
                    border-radius: var(--radius-sm);
                    background: rgba(255,255,255,0.8);
                    font-family: 'Space Mono', monospace;
                    font-size: 1rem;
                    text-align: center;
                    color: var(--ink);
                    transition: border-color 0.18s, box-shadow 0.18s;
                }

                    .score-row input[type="number"]:focus {
                        outline: none;
                        border-color: var(--rust);
                        box-shadow: 0 0 0 3px rgba(181,69,27,0.13);
                    }

            .cat-title {
                font-family: 'Playfair Display', serif;
                font-size: 1.2rem;
                color: var(--rust);
                margin-bottom: 4px;
            }

            .cat-desc {
                font-size: 0.88rem;
                color: var(--ink-light);
                margin-bottom: 18px;
                line-height: 1.45;
            }

            /* =====================================================
           DETAIL MODAL
        ===================================================== */
            .detail-head {
                padding: 20px 22px 14px;
                border-bottom: 1px solid var(--parchment-dk);
            }

                .detail-head h2 {
                    font-family: 'Playfair Display', serif;
                    font-size: 1.35rem;
                }

                .detail-head p {
                    font-size: 0.86rem;
                    opacity: 0.72;
                    margin-top: 4px;
                }

            .detail-body {
                padding: 18px 22px;
            }

            /* =====================================================
           PROFILE MODAL
        ===================================================== */
            .profile-top {
                padding: 24px 24px 0;
            }

            .avatar {
                width: 52px;
                height: 52px;
                border-radius: 50%;
                background: var(--rust);
                color: #fff;
                font-family: 'Playfair Display', serif;
                font-size: 1.4rem;
                display: flex;
                align-items: center;
                justify-content: center;
                margin-bottom: 12px;
                box-shadow: 0 4px 14px rgba(181,69,27,0.3);
            }

            .profile-name {
                font-family: 'Playfair Display', serif;
                font-size: 1.75rem;
                line-height: 1;
            }

            .profile-sub {
                color: var(--ink-light);
                font-size: 0.9rem;
                margin-top: 4px;
            }

            .stats-grid {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
                margin: 18px 24px;
            }

            .stat-card {
                background: rgba(255,255,255,0.65);
                border: 1px solid var(--parchment-dk);
                border-radius: var(--radius-sm);
                padding: 14px 8px;
                text-align: center;
            }

            .stat-val {
                font-family: 'Space Mono', monospace;
                font-size: 1.3rem;
                font-weight: 700;
                color: var(--rust);
            }

            .stat-lbl {
                font-size: 0.7rem;
                text-transform: uppercase;
                letter-spacing: 0.07em;
                color: var(--ink-light);
                margin-top: 4px;
            }

            .profile-history-title {
                font-family: 'Playfair Display', serif;
                font-size: 1.05rem;
                padding: 0 24px 10px;
                border-bottom: 1px solid var(--parchment-dk);
            }

            .profile-history {
                padding: 0 24px 24px;
                max-height: 250px;
                overflow-y: auto;
                margin-top: 8px;
            }

            .history-row {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 8px 0;
                border-bottom: 1px solid var(--parchment-dk);
                font-size: 0.9rem;
            }

                .history-row:last-child {
                    border-bottom: none;
                }

            .h-date {
                font-family: 'Space Mono', monospace;
                font-size: 0.72rem;
                color: var(--ink-light);
                flex-shrink: 0;
            }

            .h-exp {
                flex: 1;
            }

            .h-score {
                font-family: 'Space Mono', monospace;
                font-weight: 700;
                color: var(--rust);
                flex-shrink: 0;
            }

            .h-win {
                color: var(--gold);
                flex-shrink: 0;
            }

            /* =====================================================
           TOAST
        ===================================================== */
            .toast {
                position: fixed;
                bottom: 24px;
                left: 50%;
                transform: translateX(-50%);
                background: var(--ink);
                color: var(--parchment);
                padding: 10px 24px;
                border-radius: 30px;
                font-family: 'Crimson Pro', serif;
                font-size: 1rem;
                z-index: 999;
                box-shadow: 0 4px 20px rgba(0,0,0,0.25);
                white-space: nowrap;
                animation: toastin 0.22s ease;
            }

                .toast.err {
                    background: var(--rust);
                }

            @keyframes toastin {
                from {
                    opacity: 0;
                    transform: translateX(-50%) translateY(10px);
                }

                to {
                    opacity: 1;
                    transform: translateX(-50%) translateY(0);
                }
            }

            /* =====================================================
           RESPONSIVE
        ===================================================== */
            @media (max-width: 640px) {
                .header-inner {
                    padding: 12px 14px;
                }

                .logo-text h1 {
                    font-size: 1.35rem;
                }

                /* Hide the text label, keep the emoji */
                .cat-label {
                    display: none;
                }

                main {
                    padding: 14px 12px 40px;
                }

                .controls-bar {
                    padding: 10px 12px;
                }

                .exp-grid {
                    grid-template-columns: 1fr;
                }

                .stats-grid {
                    grid-template-columns: repeat(2, 1fr);
                }

                .sorted-row {
                    grid-template-columns: 1fr 90px;
                }

                .sorted-total {
                    display: none;
                }

                .scores-table th,
                .scores-table td {
                    padding: 8px 4px;
                    font-size: 0.85rem;
                }

                    /* REMOVE the display: none code that was hiding the columns */
                .scores-table th:not(:first-child):not(:last-child),
                .scores-table td:not(:first-child):not(:last-child) {
                    display: table-cell !important;
                }
            }

        /* Keep the first column (Player Name) visible while scrolling horizontally */
        .scores-table th:first-child,
        .scores-table td:first-child {
            position: sticky;
            left: 0;
            background: rgba(0,0,0,0.055);
            z-index: 10;
            box-shadow: 2px 0 5px rgba(0,0,0,0.05); /* Slight shadow to show separation */
        }

        /* Ensure the table wrapper allows horizontal scrolling */
        .table-body {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

            @media (max-width: 380px) {
                .score-row {
                    flex-direction: column;
                    align-items: flex-start;
                }

                    .score-row input[type="number"] {
                        width: 100%;
                    }
            }
    </style>
</head>
<body>

    <!-- ════════════════════════════════════ HEADER -->
    <header>
        <div class="header-inner">
            <div class="logo-group">
                <span class="feather">🪶</span>
                <div class="logo-text">
                    <h1>Wingspan</h1>
                    <p>Score Tracker &amp; Statistics</p>
                </div>
            </div>
            <button id="btn-new-game" class="btn btn-rust">＋ New Game</button>
        </div>
    </header>

    <!-- ════════════════════════════════════ MAIN -->
    <main>

        <!-- Controls -->
        <div class="controls-bar">
            <span class="sort-label">Sort by:</span>
            <div class="chips" id="sort-chips">
                <button class="chip active" data-sort="date">Date</button>
                <button class="chip" data-sort="total">Total</button>
                <button class="chip" data-sort="birds">Birds</button>
                <button class="chip" data-sort="bonus">Bonus</button>
                <button class="chip" data-sort="roundEnd">Round End</button>
                <button class="chip" data-sort="eggs">Eggs</button>
                <button class="chip" data-sort="food">Food</button>
                <button class="chip" data-sort="tucked">Tucked</button>
                <button class="chip" data-sort="nectar">Nectar</button>
                <button class="chip" data-sort="hummingbirds">Hummingbirds</button>
            </div>
            <select id="filter-exp" class="filter-select">
                <option value="">All Expansions</option>
                <option value="base">Base Game</option>
                <option value="europe">Europe</option>
                <option value="oceania">Oceania</option>
                <option value="americas">Americas</option>
            </select>
        </div>

        <!-- Games list -->
        <div class="games-wrap">
            <div id="loading" class="state-box">
                <div class="spinner"></div>
                <p>Loading games…</p>
            </div>
            <div id="empty" class="state-box hidden">
                <span class="icon">🐦</span>
                <p>No games yet — add your first!</p>
            </div>
            <div id="games-list"></div>
        </div>

    </main>

    <!-- ════════════════════════════════════ WIZARD -->
    <div id="wizard-overlay" class="overlay hidden">
        <div class="modal modal-wizard">
            <button class="modal-close-btn" id="wizard-close">✕</button>
            <div class="wizard-head">
                <h2 id="wizard-title">New Game</h2>
                <div class="step-dots" id="step-dots"></div>
            </div>
            <div class="wizard-body" id="wizard-body"></div>
            <div class="wizard-foot">
                <button id="wizard-back" class="btn btn-ghost">← Back</button>
                <button id="wizard-next" class="btn btn-rust">Next →</button>
            </div>
        </div>
    </div>

    <!-- ════════════════════════════════════ DETAIL -->
    <div id="detail-overlay" class="overlay hidden">
        <div class="modal modal-detail">
            <button class="modal-close-btn" id="detail-close">✕</button>
            <div id="detail-body"></div>
        </div>
    </div>

    <!-- ════════════════════════════════════ PROFILE -->
    <div id="profile-overlay" class="overlay hidden">
        <div class="modal modal-profile">
            <button class="modal-close-btn" id="profile-close">✕</button>
            <div id="profile-body"></div>
        </div>
    </div>

    <!-- ════════════════════════════════════ TOAST -->
    <div id="toast" class="toast hidden"></div>




































    <!-- ════════════════════════════════════ APP SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import {
            getFirestore, collection, getDocs, addDoc, updateDoc,
            deleteDoc, doc, setDoc, serverTimestamp, query, orderBy
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        /* ── Firebase config ── */
        const firebaseConfig = {
            apiKey: "AIzaSyA9PBXlWYlK3bhZpQMp1prW0_tpPc69VRI",
            authDomain: "wingspan-7c9d2.firebaseapp.com",
            projectId: "wingspan-7c9d2",
            storageBucket: "wingspan-7c9d2.firebasestorage.app",
            messagingSenderId: "837151342386",
            appId: "1:837151342386:web:f7d3c1d2da3c534e42212b",
            measurementId: "G-0QRZMFT5SE"
        };

        const fbApp = initializeApp(firebaseConfig);
        const db = getFirestore(fbApp);

        /* ══════════════════════════════════════════════════
           CONSTANTS
        ══════════════════════════════════════════════════ */
        const CATS = [
            { key: "birds", label: "Birds", emoji: "🦅", desc: "Points from bird cards placed in your habitats." },
            { key: "bonus", label: "Bonus Cards", emoji: "🎯", desc: "Points scored from your bonus card objectives." },
            { key: "roundEnd", label: "Round End", emoji: "🏁", desc: "Points scored from end-of-round goals." },
            { key: "eggs", label: "Eggs", emoji: "🥚", desc: "Egg tokens remaining on your bird cards." },
            { key: "food", label: "Food", emoji: "🌾", desc: "Food tokens cached on bird cards." },
            { key: "tucked", label: "Tucked Cards", emoji: "🃏", desc: "Cards tucked under bird cards." },
            { key: "nectar", label: "Nectar", emoji: "🌸", desc: "Nectar tokens (Oceania expansion)." },
            { key: "hummingbirds", label: "Hummingbirds", emoji: "🐦", desc: "Points from hummingbird mechanics (expansion rule)." },
        ];

        const EXPS = [
            { key: "americas", label: "Americas", cls: "exp-americas" },
            { key: "oceania", label: "Oceania", cls: "exp-oceania" },
            { key: "europe", label: "Europe", cls: "exp-europe" },
            { key: "base", label: "Base Game", cls: "exp-base" },
        ];

        /* ══════════════════════════════════════════════════
           STATE
        ══════════════════════════════════════════════════ */
        const S = {
            games: [],
            players: [],
            sortBy: "date",
            filterEx: "",
        };

        /* ══════════════════════════════════════════════════
           FIREBASE
        ══════════════════════════════════════════════════ */
        async function fetchGames() {
            const q = query(collection(db, "games"), orderBy("createdAt", "desc"));
            const snap = await getDocs(q);
            return snap.docs.map(d => ({ id: d.id, ...d.data() }));
        }
        async function fbAdd(data) { return (await addDoc(collection(db, "games"), { ...data, createdAt: serverTimestamp() })).id; }
        async function fbUpdate(id, data) { await updateDoc(doc(db, "games", id), { ...data, updatedAt: serverTimestamp() }); }
        async function fbDelete(id) { await deleteDoc(doc(db, "games", id)); }

        const normalizePlayerKey = (name) =>
            name
                .trim()
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/[^a-z0-9]+/g, "-")
                .replace(/^-+|-+$/g, "");

        async function fetchPlayers() {
            const snap = await getDocs(collection(db, "players"));
            return snap.docs
                .map(d => d.data()?.name?.trim())
                .filter(Boolean)
                .sort((a, b) => a.localeCompare(b));
        }

        async function ensurePlayers(names) {
            const unique = [...new Set(names.map(n => n.trim()).filter(Boolean))];
            await Promise.all(unique.map(async (name) => {
                const id = normalizePlayerKey(name);
                if (!id) return;
                await setDoc(doc(db, "players", id), {
                    name,
                    createdAt: serverTimestamp(),
                    updatedAt: serverTimestamp()
                }, { merge: true });
            }));
        }

        /* ══════════════════════════════════════════════════
           HELPERS
        ══════════════════════════════════════════════════ */
        const total = s => CATS.reduce((n, c) => n + (Number(s[c.key]) || 0), 0);
        const expCls = k => EXPS.find(e => e.key === k)?.cls || "exp-base";
        const expLbl = k => EXPS.find(e => e.key === k)?.label || "Base Game";

        function visibleCatsForExpansion(expansion) {
            if (expansion === "base" || expansion === "europe") {
                return CATS.filter(c => c.key !== "hummingbirds" && c.key !== "nectar");
            }
            if (expansion === "oceania") {
                return CATS.filter(c => c.key !== "hummingbirds");
            }
            return CATS;
        }

        function visibleKeysForExpansion(expansion) {
            return new Set(visibleCatsForExpansion(expansion).map(c => c.key));
        }

        const winner = g => {
            let best = null, hi = -1;
            for (const ps of g.playerScores) { const t = total(ps.scores); if (t > hi) { hi = t; best = ps.player; } }
            return best;
        };

        /* ══════════════════════════════════════════════════
           RENDER
        ══════════════════════════════════════════════════ */
        function render() {
            const list = document.getElementById("games-list");
            const load = document.getElementById("loading");
            const emp = document.getElementById("empty");
            load.classList.add("hidden");
            list.innerHTML = "";

            let games = [...S.games];
            if (S.filterEx) games = games.filter(g => g.expansion === S.filterEx);

            if (!games.length) { emp.classList.remove("hidden"); return; }
            emp.classList.add("hidden");

            if (S.sortBy === "date") renderGrouped(games, list);
            else renderSorted(games, list);
        }

        function renderGrouped(games, list) {
            games.forEach(g => {
                const w = winner(g);
                const div = document.createElement("div");
                div.className = "game-group " + expCls(g.expansion);

                div.innerHTML = `
      <div class="group-header" data-id="${g.id}">
        <div class="group-meta">
          <span class="game-date">${g.date || "—"}</span>
          <span class="exp-badge">${expLbl(g.expansion)}</span>
          <span class="winner-tag">🏆 ${w}</span>
        </div>
        <div class="group-actions">
          <button class="btn-icon" data-action="edit" data-id="${g.id}" title="Edit">✏️</button>
          <button class="btn-icon" data-action="delete" data-id="${g.id}" title="Delete">🗑️</button>
        </div>
      </div>
      <div class="table-body">${buildTable(g)}</div>
    `;

                div.querySelector(".group-header").addEventListener("click", e => {
                    if (e.target.closest("[data-action]")) return;
                    const tb = div.querySelector(".table-body");
                    tb.style.display = tb.style.display === "none" ? "" : "none";
                });

                div.querySelectorAll("[data-action]").forEach(btn => {
                    btn.addEventListener("click", e => {
                        e.stopPropagation();
                        btn.dataset.action === "edit" ? openWizard(g.id) : confirmDelete(g.id);
                    });
                });

                div.querySelectorAll(".player-link").forEach(el =>
                    el.addEventListener("click", () => openProfile(el.dataset.player))
                );
                div.querySelectorAll(".score-cell").forEach(el =>
                    el.addEventListener("click", () => openDetail(el.dataset.gid))
                );

                list.appendChild(div);
            });
        }

        function buildTable(g) {
            const sorted = [...g.playerScores].sort((a, b) => total(b.scores) - total(a.scores));
            const w = sorted[0]?.player;
            const heads = CATS.map(c => `<th>${c.emoji} <span class="cat-label">${c.label}</span></th>`).join("");
            const rows = sorted.map(ps => {
                const t = total(ps.scores);
                const isW = ps.player === w;
                const cells = CATS.map(c =>
                    `<td><span class="score-cell" data-gid="${g.id}">${ps.scores[c.key] ?? "-"}</span></td>`
                ).join("");
                return `<tr class="${isW ? "winner-row" : ""}">
          <td><span class="player-link" data-player="${ps.player}">${ps.player}</span></td>
          ${cells}
          <td class="total-cell">${t}</td>
        </tr>`;
            }).join("");
            return `<table class="scores-table">
        <thead><tr><th>Player</th>${heads}<th>Total</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
        }

        function renderSorted(games, list) {
            const cat = CATS.find(c => c.key === S.sortBy);
            const rows = [];

            games.forEach(g => {
                g.playerScores.forEach(ps => {
                    const tot = total(ps.scores);
                    rows.push({
                        g,
                        player: ps.player,
                        scores: ps.scores,
                        val: S.sortBy === "total"
                            ? tot
                            : (Number(ps.scores[S.sortBy]) || 0),
                        tot
                    });
                });
            });

            rows.sort((a, b) => b.val - a.val);

            rows.forEach(r => {
                const div = document.createElement("div");
                div.className = `sorted-row ${expCls(r.g.expansion)}`;
                div.innerHTML = `
      <div>
        <div class="sorted-player">${r.player}</div>
        <div class="sorted-sub">${r.g.date || "—"} · ${expLbl(r.g.expansion)}</div>
      </div>
      <div>
        <div class="sorted-score">${r.val}</div>
        <div class="sorted-score-label">
          ${S.sortBy === "total" ? "🏆 Total" : `${cat.emoji} ${cat.label}`}
        </div>
      </div>
      <div class="sorted-total">Total: <strong>${r.tot}</strong></div>
    `;
                div.addEventListener("click", () => openDetail(r.g.id));
                list.appendChild(div);
            });
        }

        /* ══════════════════════════════════════════════════
           DETAIL MODAL
        ══════════════════════════════════════════════════ */
        function openDetail(gameId) {
            const g = S.games.find(x => x.id === gameId);
            if (!g) return;
            const w = winner(g);
            const body = document.getElementById("detail-body");
            body.innerHTML = `
        <div class="detail-head ${expCls(g.expansion)}">
          <h2>${expLbl(g.expansion)} — ${g.date || "—"}</h2>
          <p>Winner: 🏆 ${w}${g.notes ? ` · "${g.notes}"` : ""}</p>
        </div>
        <div class="detail-body">${buildTable(g)}</div>
      `;
            body.querySelectorAll(".player-link").forEach(el =>
                el.addEventListener("click", () => {
                    document.getElementById("detail-overlay").classList.add("hidden");
                    openProfile(el.dataset.player);
                })
            );
            document.getElementById("detail-overlay").classList.remove("hidden");
        }

        /* ══════════════════════════════════════════════════
           PROFILE MODAL
        ══════════════════════════════════════════════════ */
        function openProfile(name) {
            const pGames = S.games.filter(g => g.playerScores.some(ps => ps.player === name));
            const rows = pGames.map(g => {
                const ps = g.playerScores.find(p => p.player === name);
                const t = total(ps.scores);
                const won = winner(g) === name;
                return { g, ps, t, won };
            });

            const n = rows.length;
            const wins = rows.filter(r => r.won).length;
            const hiScore = n ? Math.max(...rows.map(r => r.t)) : 0;
            const avgT = n ? Math.round(rows.reduce((a, r) => a + r.t, 0) / n) : 0;
            const avgEggs = n ? Math.round(rows.reduce((a, r) => a + (Number(r.ps.scores.eggs) || 0), 0) / n) : 0;
            const avgTuck = n ? Math.round(rows.reduce((a, r) => a + (Number(r.ps.scores.tucked) || 0), 0) / n) : 0;
            const winRate = n ? Math.round((wins / n) * 100) : 0;
            const initials = name.split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase();

            const histHtml = [...rows]
                .sort((a, b) => new Date(b.g.date) - new Date(a.g.date))
                .map(r => `
          <div class="history-row">
            <span class="h-date">${r.g.date || "—"}</span>
            <span class="h-exp">${expLbl(r.g.expansion)}</span>
            ${r.won ? '<span class="h-win">🏆</span>' : ""}
            <span class="h-score">${r.t}</span>
          </div>`).join("") || '<p style="padding-top:10px;color:var(--ink-light)">No games yet.</p>';

            document.getElementById("profile-body").innerHTML = `
        <div class="profile-top">
          <div class="avatar">${initials}</div>
          <div class="profile-name">${name}</div>
          <div class="profile-sub">${n} game${n !== 1 ? "s" : ""} played</div>
        </div>
        <div class="stats-grid">
          <div class="stat-card"><div class="stat-val">${winRate}%</div><div class="stat-lbl">Win Rate</div></div>
          <div class="stat-card"><div class="stat-val">${hiScore}</div><div class="stat-lbl">High Score</div></div>
          <div class="stat-card"><div class="stat-val">${avgT}</div><div class="stat-lbl">Avg Score</div></div>
          <div class="stat-card"><div class="stat-val">${avgEggs}</div><div class="stat-lbl">Avg Eggs</div></div>
          <div class="stat-card"><div class="stat-val">${avgTuck}</div><div class="stat-lbl">Avg Tucked</div></div>
          <div class="stat-card"><div class="stat-val">${wins}</div><div class="stat-lbl">Wins</div></div>
        </div>
        <div class="profile-history-title">Game History</div>
        <div class="profile-history">${histHtml}</div>
      `;
            document.getElementById("profile-overlay").classList.remove("hidden");
        }

        /* ══════════════════════════════════════════════════
           WIZARD
        ══════════════════════════════════════════════════ */
        let W = {};

        function wizardSteps() {
            return ["setup", ...visibleCatsForExpansion(W.expansion).map(c => c.key)];
        }

        function openWizard(gameId = null) {
            if (gameId) {
                const g = S.games.find(x => x.id === gameId);
                W = {
                    step: 0, editId: gameId,
                    players: g.playerScores.map(ps => ps.player),
                    expansion: g.expansion, date: g.date, notes: g.notes || "",
                    scores: Object.fromEntries(g.playerScores.map(ps => [ps.player, { ...ps.scores }])),
                };
            } else {
                W = {
                    step: 0, editId: null,
                    players: [], expansion: "americas",
                    date: new Date().toISOString().slice(0, 10),
                    notes: "", scores: {},
                };
            }
            drawStep();
            document.getElementById("wizard-overlay").classList.remove("hidden");
        }

        function drawStep() {
            const steps = wizardSteps();
            if (W.step >= steps.length) W.step = steps.length - 1;

            const stepKey = steps[W.step];
            const isLast = W.step === steps.length - 1;

            document.getElementById("step-dots").innerHTML = steps.map((_, i) =>
                `<div class="step-dot ${i === W.step ? "active" : i < W.step ? "done" : ""}"></div>`
            ).join("");

            document.getElementById("wizard-back").style.visibility = W.step === 0 ? "hidden" : "visible";
            document.getElementById("wizard-next").textContent = isLast
                ? (W.editId ? "💾 Save Changes" : "✅ Save Game") : "Next →";

            const body = document.getElementById("wizard-body");

            if (stepKey === "setup") {
                document.getElementById("wizard-title").textContent = W.editId ? "Edit Game" : "New Game";
                const pChips = S.players.map(p =>
                    `<button class="pchip ${W.players.includes(p) ? "on" : ""}" data-p="${p}">${p}</button>`
                ).join("");
                const eCards = EXPS.map(e =>
                    `<button class="exp-card ${e.cls} ${W.expansion === e.key ? "on" : ""}" data-e="${e.key}">${e.label}</button>`
                ).join("");

                body.innerHTML = `
          <div class="field">
            <label>Date</label>
            <input type="date" id="w-date" value="${W.date}" />
          </div>
          <div class="field">
            <label>Players</label>
            <div class="player-chips-wrap" id="pchips">${pChips}</div>
            <div class="add-player-row">
              <input type="text" id="new-player" placeholder="Add new player…" />
              <button class="btn btn-rust" id="btn-add-p" style="padding:8px 14px;font-size:.9rem;">Add</button>
            </div>
          </div>
          <div class="field">
            <label>Expansion</label>
            <div class="exp-grid">${eCards}</div>
          </div>
          <div class="field">
            <label>Notes (optional)</label>
            <input type="text" id="w-notes" placeholder="e.g. First Oceania game!" value="${W.notes}" />
          </div>
        `;

                body.querySelectorAll(".pchip").forEach(btn => {
                    btn.addEventListener("click", () => {
                        const p = btn.dataset.p;
                        if (W.players.includes(p)) { W.players = W.players.filter(x => x !== p); btn.classList.remove("on"); }
                        else { W.players.push(p); btn.classList.add("on"); }
                    });
                });

                body.querySelectorAll(".exp-card").forEach(btn => {
                    btn.addEventListener("click", () => {
                        W.expansion = btn.dataset.e;
                        W.step = 0;
                        drawStep();
                    });
                });

                const addPlayer = () => {
                    const inp = document.getElementById("new-player");
                    const name = inp.value.trim();
                    if (!name) return;

                    const existing = S.players.find(p => p.toLowerCase() === name.toLowerCase());
                    const finalName = existing || name;

                    if (!S.players.includes(finalName)) {
                        S.players.push(finalName);
                        S.players.sort((a, b) => a.localeCompare(b));
                    }

                    if (!W.players.includes(finalName)) {
                        W.players.push(finalName);
                    }

                    inp.value = "";
                    drawStep();
                };

                document.getElementById("btn-add-p").addEventListener("click", addPlayer);
                document.getElementById("new-player").addEventListener("keydown", e => {
                    if (e.key === "Enter") {
                        e.preventDefault();
                        addPlayer();
                    }
                });

            } else {
                const cat = visibleCatsForExpansion(W.expansion).find(c => c.key === stepKey);
                document.getElementById("wizard-title").textContent = `${cat.emoji} ${cat.label}`;
                body.innerHTML = `
          <p class="cat-title">${cat.emoji} ${cat.label}</p>
          <p class="cat-desc">${cat.desc}</p>
          <div class="score-rows" id="score-rows"></div>
        `;
                const rows = document.getElementById("score-rows");
                W.players.forEach(p => {
                    const val = W.scores[p]?.[cat.key] ?? 0;
                    const row = document.createElement("div");
                    row.className = "score-row";
                    row.innerHTML = `<label>${p}</label>
            <input type="number" min="0" max="200" data-p="${p}" value="${val}" />`;
                    rows.appendChild(row);
                });
                const inputs = rows.querySelectorAll("input");
                if (inputs[0]) setTimeout(() => inputs[0].focus(), 40);
                inputs.forEach((inp, i) => {
                    inp.addEventListener("keydown", e => {
                        if (e.key === "Enter" || e.key === "Tab") {
                            e.preventDefault();
                            inputs[i + 1] ? inputs[i + 1].focus() : document.getElementById("wizard-next").click();
                        }
                    });
                });
            }
        }

        function collectStep() {
            const steps = wizardSteps();
            const stepKey = steps[W.step];

            if (stepKey === "setup") {
                W.date = document.getElementById("w-date")?.value || W.date;
                W.notes = document.getElementById("w-notes")?.value || "";
                if (!W.players.length) { toast("Select at least one player.", true); return false; }
                W.players.forEach(p => { if (!W.scores[p]) W.scores[p] = {}; });
            } else {
                document.querySelectorAll(".score-rows input").forEach(inp => {
                    if (!W.scores[inp.dataset.p]) W.scores[inp.dataset.p] = {};
                    W.scores[inp.dataset.p][stepKey] = Number(inp.value) || 0;
                });
            }
            return true;
        }

        async function wizardNext() {
            if (!collectStep()) return;
            const steps = wizardSteps();
            if (W.step < steps.length - 1) { W.step++; drawStep(); return; }
            await submitWizard();
        }

        function wizardBack() {
            collectStep();
            if (W.step > 0) { W.step--; drawStep(); }
        }

        async function submitWizard() {
            const nextBtn = document.getElementById("wizard-next");
            nextBtn.disabled = true;
            nextBtn.textContent = "Saving…";

            const visibleKeys = visibleKeysForExpansion(W.expansion);

            const data = {
                date: W.date, expansion: W.expansion, notes: W.notes,
                playerScores: W.players.map(p => ({
                    player: p,
                    scores: Object.fromEntries(
                        CATS.map(cat => [
                            cat.key,
                            visibleKeys.has(cat.key) ? (W.scores[p]?.[cat.key] ?? 0) : null
                        ])
                    )
                }))
            };

            try {
                await ensurePlayers(W.players);

                if (W.editId) {
                    S.games = S.games.map(g => g.id === W.editId ? { ...g, ...data } : g);
                    render();
                    await fbUpdate(W.editId, data);
                    toast("Game updated 🦅");
                } else {
                    const tmp = "tmp_" + Date.now();
                    S.games.unshift({ id: tmp, ...data });
                    render();
                    const realId = await fbAdd(data);
                    S.games = S.games.map(g => g.id === tmp ? { ...g, id: realId } : g);
                    toast("Game saved! 🎉");
                }

                S.players = [...new Set([...S.players, ...W.players])].sort((a, b) => a.localeCompare(b));
                document.getElementById("wizard-overlay").classList.add("hidden");
            } catch (err) {
                console.error(err);
                toast("Save failed — check Firebase.", true);
            } finally {
                nextBtn.disabled = false;
                nextBtn.textContent = W.editId ? "💾 Save Changes" : "✅ Save Game";
            }
        }

        /* ══════════════════════════════════════════════════
           DELETE
        ══════════════════════════════════════════════════ */
        function confirmDelete(id) {
            const g = S.games.find(x => x.id === id);
            if (!confirm(`Delete game from ${g?.date || "this date"}? This cannot be undone.`)) return;
            S.games = S.games.filter(x => x.id !== id);
            render();
            fbDelete(id).then(() => toast("Game deleted.")).catch(() => {
                toast("Delete failed.", true);
                boot();
            });
        }

        /* ══════════════════════════════════════════════════
           TOAST
        ══════════════════════════════════════════════════ */
        let toastTimer;
        function toast(msg, err = false) {
            const el = document.getElementById("toast");
            el.textContent = msg;
            el.className = "toast" + (err ? " err" : "");
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.add("hidden"), 3200);
        }

        /* ══════════════════════════════════════════════════
           EVENT LISTENERS
        ══════════════════════════════════════════════════ */
        document.getElementById("btn-new-game").addEventListener("click", () => openWizard());

        document.getElementById("wizard-next").addEventListener("click", wizardNext);
        document.getElementById("wizard-back").addEventListener("click", wizardBack);
        document.getElementById("wizard-close").addEventListener("click", () =>
            document.getElementById("wizard-overlay").classList.add("hidden"));

        document.getElementById("detail-close").addEventListener("click", () =>
            document.getElementById("detail-overlay").classList.add("hidden"));

        document.getElementById("profile-close").addEventListener("click", () =>
            document.getElementById("profile-overlay").classList.add("hidden"));

        ["wizard-overlay", "detail-overlay", "profile-overlay"].forEach(id => {
            document.getElementById(id).addEventListener("click", e => {
                if (e.target.id === id) e.target.classList.add("hidden");
            });
        });

        document.getElementById("sort-chips").addEventListener("click", e => {
            const chip = e.target.closest(".chip");
            if (!chip) return;
            document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
            chip.classList.add("active");
            S.sortBy = chip.dataset.sort;
            render();
        });

        document.getElementById("filter-exp").addEventListener("change", e => {
            S.filterEx = e.target.value;
            render();
        });

        /* ══════════════════════════════════════════════════
           BOOT
        ══════════════════════════════════════════════════ */
        async function boot() {
            try {
                const [games, players] = await Promise.all([
                    fetchGames(),
                    fetchPlayers()
                ]);

                S.games = games;

                const fromGames = [...new Set(
                    S.games.flatMap(g => g.playerScores.map(ps => ps.player))
                )].sort((a, b) => a.localeCompare(b));

                S.players = [...new Set([...players, ...fromGames])]
                    .filter(Boolean)
                    .sort((a, b) => a.localeCompare(b));

                render();
            } catch (err) {
                console.error(err);
                document.getElementById("loading").innerHTML =
                    `<p style="color:var(--rust);text-align:center">⚠️ Could not reach Firebase.<br><small>${err.message}</small></p>`;
            }
        }

        boot();
    </script>

</body>
